plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.9'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'jacoco'
	id 'org.sonarqube' version '6.0.1.5171'
}

group = 'com.restaurant'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '21'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

sonar {
	properties {
		property "sonar.projectKey", "restaurant-discovery-service"
		property "sonar.projectName", "Restaurant Discovery Service (Eureka)"
		property "sonar.host.url", "http://localhost:9000"

		// Eureka chỉ là config server, skip analysis
		property "sonar.skip", "true"

		// Nếu muốn analyze, uncomment dưới đây:
		// property "sonar.sources", "src/main/java"
		// property "sonar.tests", "src/test/java"
		// property "sonar.exclusions", "**/*Application.java"
	}
}

// ========================================
// JACOCO (OPTIONAL)
// ========================================
jacoco {
	toolVersion = "0.8.12"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2022.0.4"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
