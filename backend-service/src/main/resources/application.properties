server.port=8081
spring.application.name=user-service
spring.profiles.active=dev

# ========================================
# PRIMARY DATABASE: Restaurant DB
# ========================================
spring.datasource.jdbc-url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/restaurant?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:restaurant_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:restaurant_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Primary Database - HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=RestaurantHikariPool

# ========================================
# SECONDARY DATABASE: Analytics DB
# ========================================
spring.datasource.analytics.jdbc-url=${SPRING_DATASOURCE_URL_ANALYTICS:jdbc:mysql://localhost:3306/analytics?useSSL=false&serverTimezone=UTC}
spring.datasource.analytics.username=${SPRING_DATASOURCE_USERNAME:restaurant_user}
spring.datasource.analytics.password=${SPRING_DATASOURCE_PASSWORD:restaurant_pass}
spring.datasource.analytics.driver-class-name=com.mysql.cj.jdbc.Driver
# Analytics Database - HikariCP Settings
spring.datasource.analytics.hikari.maximum-pool-size=5
spring.datasource.analytics.hikari.minimum-idle=2
spring.datasource.analytics.hikari.connection-timeout=30000
spring.datasource.analytics.hikari.idle-timeout=600000
spring.datasource.analytics.hikari.max-lifetime=1800000
spring.datasource.analytics.hikari.pool-name=AnalyticsHikariPool

# ========================================
# MONGODB CONFIGURATION (Event Store)
# ========================================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.repositories.enabled=true

# ========================================
# JPA/HIBERNATE CONFIG
# ========================================
# Note: Hibernate properties are configured in DistributedTransactionConfig.java
# These global settings may be overridden by EntityManagerFactory beans
spring.jpa.open-in-view=false

# ========================================
# TRANSACTION MANAGER SETTINGS
# ========================================
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# ========================================
# RETRY CONFIGURATION
# ========================================
spring.retry.enabled=true

# NEW: Circuit Breaker
resilience4j.circuitbreaker.instances.searchService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.searchService.wait-duration-in-open-state=30000

# NEW: Async Config
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ========================================
# UPLOAD DIRECTORY
# ========================================
spring.web.resources.static-locations=classpath:/static/,file:uploads/
file.upload-dir=uploads

# ========================================
# EMAIL CONFIGURATION
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ========================================
# WEBSOCKET CONFIGURATION
# ========================================
spring.web.cors.allowed-origins=http://localhost:3000
spring.websocket.message-broker.enabled=true
spring.websocket.sockjs.enabled=true
spring.websocket.session-timeout=300000

# ========================================
# JWT CONFIGURATION
# ========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.algorithm=HS256

# ========================================
# CLOUDINARY CONFIGURATION
# ========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ========================================
# EUREKA CLIENT CONFIG
# ========================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ========================================
# ACTUATOR & PROMETHEUS METRICS
# ========================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read_only
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
management.server.port=8081
management.metrics.enable.jvm=true
management.metrics.enable.hikaricp=true
management.metrics.enable.hibernate=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}

# ========================================
# RABBITMQ CONFIGURATION
# ========================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST}
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=10000
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# ========================================
# REDIS CONFIGURATION
# ========================================
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:admin}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# ========================================
# KAFKA CONFIGURATION
# ========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.file.name=${LOG_PATH:logs/user-service.log}
logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.messaging.simp.broker=WARN
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

# Transaction & Database Logging
logging.level.com.management.restaurant=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.mongodb.repository=DEBUG

# DataSource logging
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG