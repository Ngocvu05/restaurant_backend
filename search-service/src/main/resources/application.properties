spring.autoconfigure.exclude=\
  org.springframework.boot.actuate.autoconfigure.elasticsearch.ElasticsearchReactiveHealthContributorAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.data.elasticsearch.ElasticsearchHealthContributorAutoConfiguration

server.port=8082
spring.application.name=search-service

# ========================================
# USER SERVICE CONFIG
# ========================================
user-service.url=${USER_SERVICE_URL:http://user-service:8081}
system.user.username=${SYSTEM_USER_USERNAME:admin}
system.user.password=${SYSTEM_USER_PASSWORD:admin123}
system.token.retry.max-attempts=${SYSTEM_TOKEN_RETRY_MAX_ATTEMPTS:10}
system.token.retry.delay-seconds=${SYSTEM_TOKEN_RETRY_DELAY_SECONDS:3}

# Data Sync Config
app.user-service.base-url=${USER_SERVICE_URL:http://user-service:8081}/api/v1/sync

# Elasticsearch config (if any)
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=
spring.elasticsearch.password=

# Database config
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT config
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.algorithm=HS256

# ========================================
# EUREKA CLIENT CONFIG
# ========================================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-service:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${HOSTNAME:search-service}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

#RabbitMQ Config
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST}
spring.rabbitmq.connection-timeout=30000

spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.max-interval=10000
spring.rabbitmq.template.retry.multiplier=2

spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1

# ========================================
# MANAGEMENT & METRICS
# ========================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.service=search-service
management.appoptics.metrics.export.enabled=true

# Custom metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.http=true

# Health checks
management.health.elasticsearch.enabled=false
management.health.rabbit.enabled=true
management.health.db.enabled=true

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.elasticsearch=INFO
logging.level.com.management.search_service=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

logging.file.name=${LOG_PATH:logs/<service-name>.log}
logging.level.com.example.search_service=DEBUG
logging.pattern.file="%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
logging.file.max-size=10MB
logging.file.max-history=30