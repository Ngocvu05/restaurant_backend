groups:
  - name: transaction_alerts
    rules:
      - alert: HighDeadlockRate
        expr: rate(transaction_deadlock_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High deadlock rate detected"
          description: "Deadlock rate is {{ $value }} per second"

      - alert: LongTransactionDuration
        expr: histogram_quantile(0.95, rate(transaction_duration_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Long transaction duration"
          description: "P95 transaction duration is {{ $value }} seconds"

      - alert: ConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Connection pool nearly exhausted"
          description: "Pool usage is {{ $value }}%"