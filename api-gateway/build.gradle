plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'com.restaurant'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ========================================
// SONARQUBE CONFIGURATION
// ========================================
sonar {
    properties {
        property "sonar.projectKey", "restaurant-api-gateway"
        property "sonar.projectName", "Restaurant API Gateway"
        property "sonar.host.url", "http://localhost:9000"

        property "sonar.sources", "src/main/java"
        property "sonar.tests", "src/test/java"

        property "sonar.coverage.jacoco.xmlReportPaths",
                "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"

        property "sonar.exclusions", """
            **/config/**,
            **/filter/**,
            **/exception/**,
            **/*Application.java,
            **/ApiGatewayApplication.java
        """.trim().replaceAll(/\s+/, '')

        property "sonar.coverage.exclusions", """
            **/config/**,
            **/filter/**,
            **/exception/**
        """.trim().replaceAll(/\s+/, '')

//        property "sonar.language", "java"
//        property "sonar.java.source", "21"
//        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.java.binaries", "${buildDir}/classes/java/main"
//        property "sonar.java.libraries", configurations.runtimeClasspath.files.join(',')
    }
}

// ========================================
// JACOCO CONFIGURATION
// ========================================
jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/config/**',
                    '**/filter/**',
                    '**/exception/**',
                    '**/*Application.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.40
            }
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

//check {
//    dependsOn jacocoTestCoverageVerification
//}

tasks.register('sonarAnalyze') {
    group = 'verification'
    description = 'Compile code and run SonarQube analysis (NO tests)'

    dependsOn 'classes', 'compileJava', 'compileTestJava'
    finalizedBy 'sonar'
}

repositories {
    mavenCentral()
}

ext {
    set('springBootAdminVersion', "3.5.0")
    set('springCloudVersion', "2025.0.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "de.codecentric:spring-boot-admin-dependencies:${springBootAdminVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}