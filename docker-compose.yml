services:
  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    command: >
      --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
      --default-time-zone='+07:00'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./mysql_data:/var/lib/mysql
      # SQL files now in sql_init folder
      - ./sql_init/01-init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./sql_init/02-init-analytics-db.sql:/docker-entrypoint-initdb.d/02-init-analytics-db.sql
      - ./sql_init/03-init-chat-db.sql:/docker-entrypoint-initdb.d/03-init-chat-db.sql
      - ./sql_init/04-init-refresh-token-migration.sql:/docker-entrypoint-initdb.d/04-init-refresh-token-migration.sql
      # User security enhancements
      - ./sql_init/05-add-user-security-fields.sql:/docker-entrypoint-initdb.d/05-add-user-security-fields.sql
      # OAuth2 links table
      - ./sql_init/06-add-oauth2-links.sql:/docker-entrypoint-initdb.d/06-add-oauth2-links.sql
    networks:
      - microservices-network

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INIT_DB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INIT_DB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INIT_DB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./sql_init/init-mongodb.js:/docker-entrypoint-initdb.d/init-mongodb.js:ro
    command: mongod --auth
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - microservices-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    command: >
      sh -c "redis-server 
      --appendonly yes 
      --requirepass $${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  rabbitmq :
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
      - "61613:61613" # STOMP (WebSocket)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - microservices-network

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - microservices-network

  discovery-service:
    build:
      context: ./discovery-service
    container_name: discovery-service
    env_file: .env
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - microservices-network

  user-service:
    image: user-service:latest
    build:
      context: ./backend-service
    container_name: user-service
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker

      # MySQL Database Configuration
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_USER}
      - SPRING_DATASOURCE_URL_ANALYTICS=${SPRING_DATASOURCE_URL_ANALYTICS}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      # MongoDB Configuration
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI}
      - SPRING_DATA_MONGODB_DATABASE=${SPRING_DATA_MONGODB_DATABASE}

      # Redis Configuration
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # Eureka Configuration
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS=30
      - EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS=90

      # RabbitMQ Configuration
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST}

      # Kafka Configuration
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

      # JWT Configuration
      - JWT_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}

      # Email Configuration
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}

      # Cloudinary Configuration
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

      # Logging Configuration
      - LOG_FILE_PATH=/logs/user-service.log

      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC
    ports:
      - "8081:8081"
    restart: on-failure
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - microservices-network
    volumes:
      - ./logs:/logs
      - ./uploads:/uploads
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  search-service:
    image: search-service:latest
    build:
      context: ./search-service
    container_name: search-service
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_USER}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      # Database
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS=30
      - EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS=90

      # RabbitMQ configuration
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST}

      - JWT_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      # Logging Configuration
      - LOG_FILE_PATH=./logs/<service-name>.log
      # User service connection
      - APP_USER_SERVICE_BASE_URL=${APP_USER_SERVICE_BASE_URL}

      - USER_SERVICE_LOGIN_URL=${USER_SERVICE_LOGIN_URL}
      - SYSTEM_USER_USERNAME=${LOGIN_USER_NAME}
      - SYSTEM_USER_PASSWORD=${LOGIN_USER_PASSWORD}
      - SYSTEM_TOKEN_RETRY_MAX_ATTEMPTS=10
      - SYSTEM_TOKEN_RETRY_DELAY_SECONDS=3

      # Server Configuration
      - SERVER_PORT=${SEARCH_SERVICE_PORT}
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./logs:/logs
    networks:
      - microservices-network

  chat-service:
    image: chat-service:latest
    build:
      context: ./chat-service
    container_name: chat-service
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker

      # Database configuration
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL_CHAT}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

      # Redis configuration
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # RabbitMQ configuration
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST}

      # API AI configuration
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL}
      - GROQ_MODEL=${GROQ_MODEL}
      - GROQ_MAX_TOKENS=${GROQ_MAX_TOKENS}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE}
      - GROQ_TIMEOUT=${GROQ_TIMEOUT}

      # AI Configuration
      - APP_AI_SYSTEM_PROMPT=${APP_AI_SYSTEM_PROMPT}
      - APP_AI_MAX_TOKENS=${APP_AI_MAX_TOKENS}
      - APP_AI_TEMPERATURE=${APP_AI_TEMPERATURE}
      - APP_AI_CONVERSATION_HISTORY_LIMIT=${APP_AI_CONVERSATION_HISTORY_LIMIT}

      # Eureka Configuration
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS=30
      - EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS=90

      # JWT Configuration
      - JWT_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}

      # WebSocket Configuration
      - WEBSOCKET_ALLOWED_ORIGINS=${ACCESS_URL}
      - WEBSOCKET_RELAY_HOST=${WEBSOCKET_RELAY_HOST}
      - WEBSOCKET_RELAY_PORT=${WEBSOCKET_RELAY_PORT}
      - WEBSOCKET_CLIENT_LOGIN=${WEBSOCKET_CLIENT_LOGIN}
      - WEBSOCKET_CLIENT_PASSCODE=${WEBSOCKET_CLIENT_PASSCODE}
      - WEBSOCKET_SYSTEM_LOGIN=${WEBSOCKET_SYSTEM_LOGIN}
      - WEBSOCKET_SYSTEM_PASSCODE=${WEBSOCKET_SYSTEM_PASSCODE}

      # CORS Configuration
      - CORS_ALLOWED_ORIGINS=${ACCESS_URL}

      # Logging Configuration
      - LOG_LEVEL_APP=INFO
      - LOG_LEVEL_SPRING_AI=DEBUG
      - LOG_LEVEL_SPRING_WEB=INFO
      - LOG_LEVEL_HIBERNATE=WARN
      - LOG_LEVEL_HIBERNATE_SQL=DEBUG
      - LOG_LEVEL_HIBERNATE_PARAMS=TRACE
      - LOG_LEVEL_SECURITY=INFO
      - LOG_FILE_PATH=./logs/chat-service.log

      # Server Configuration
      - SERVER_PORT=${CHAT_SERVICE_PORT}

      # JVM Options for better performance
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:+UseStringDeduplication
    ports:
      - "8083:8083"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    volumes:
      - ./logs:/logs
    networks:
      - microservices-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    env_file: .env
    depends_on:
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=true
      - EUREKA_CLIENT_FETCH_REGISTRY=true
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true

      # Redis
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # RabbitMQ
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST}

      - JWT_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}

      # Gateway routes for chat service
      - SPRING_CLOUD_GATEWAY_ROUTES_CHAT_SERVICE_URI=lb://chat-service
      - SPRING_CLOUD_GATEWAY_ROUTES_CHAT_SERVICE_PREDICATES_PATH=/chat/**
      # Gateway routes for user service
      - SPRING_CLOUD_GATEWAY_ROUTES_USER_SERVICE_URI=lb://user-service
      - SPRING_CLOUD_GATEWAY_ROUTES_USER_SERVICE_PREDICATES_PATH=/users/**
      # Gateway routes for search service
      - SPRING_CLOUD_GATEWAY_ROUTES_SEARCH_SERVICE_URI=lb://search-service
      - SPRING_CLOUD_GATEWAY_ROUTES_SEARCH_SERVICE_PREDICATES_PATH=/search/**
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - microservices-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logs:/logs
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch

networks:
  microservices-network:
    driver: bridge
    name: microservices-network
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  esdata:
  chat_logs:
  prometheus_data:
  grafana_data:
  mongodb_data:
  mongodb_config: